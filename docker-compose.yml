version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omni_pms_db
    environment:
      POSTGRES_DB: omni_pms
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omni_pms_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:

